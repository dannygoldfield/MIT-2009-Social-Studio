<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connect · 2.009 Studio</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand" aria-label="Connect 2.009 Studio"><img class="connect-wordmark" src="/static/brand-2026/logo-01.png" alt="Connect 2.009"><span class="studio-label">STUDIO <small>YOUR IDEAS, TOGETHER.</small></span></a>
      <span class="header-note">Start with something yours.</span><span class="pill">LOCAL · 15 SEC</span>
    </header>
    <div class="shell">
      <aside>
        <div class="sidebar-heading">
          YOUR PROJECTS
          <button id="new-project" aria-label="New project">+</button>
        </div>
        <nav id="projects" aria-label="Projects"></nav>
        <div class="sidebar-footer">
          A little idea.<br />A new connection.
          <p>Your phrase. Your choices.<br />Your story.</p>
        </div>
      </aside>
      <main id="main"></main>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="create-dialog">
      <form id="create-form">
        <span class="eyebrow">A NEW STORY</span>
        <h2>Start with something yours.</h2>
        <label
          >Your name<input
            name="author"
            required
            maxlength="80"
            autocomplete="name"
            placeholder="Danny" /></label
        ><label
          >Project name<input
            name="name"
            required
            maxlength="100"
            placeholder="An unexpected connection" /></label
        ><label
          >Format<select name="aspect">
            <option value="vertical">9:16 · Vertical</option>
            <option value="horizontal">16:9 · Horizontal</option>
          </select></label
        >
        <p class="muted">
          Every output is 15 seconds. Your name travels with your choices and
          final approval.
        </p>
        <div class="actions">
          <button type="button" class="secondary" id="cancel-create">
            Cancel</button
          ><button type="submit">Create project →</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
